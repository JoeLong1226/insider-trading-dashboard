name: Link Buyers

on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * *'   # every day, 6:30am US Eastern (winter) - after the overnight data load

concurrency:
  group: insider-etl
  cancel-in-progress: false

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Link trades to buyers
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python link_buyers.py
