name: Run Insider Trading ETL Live

on:
  schedule:
    # Live polling while EDGAR accepts filings (6am-10pm ET), weekdays.
    # NOTE: GitHub treats these times as best-effort; real runs often come every 30-60 min.
    - cron: '*/5 10-23 * * 1-5'
    - cron: '*/5 0-3 * * 2-6'
    # Nightly catch-up sweep of the previous day's filings (~3:30-4:30am ET)
    - cron: '30 8 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = latest filings, daily = sweep by date'
        default: 'live'
        type: choice
        options:
          - live
          - daily
      start_date:
        description: 'daily mode only: first filing date to sweep (YYYY-MM-DD). Blank = yesterday'
        required: false
        default: ''
        type: string
      end_date:
        description: 'daily mode only: last filing date (YYYY-MM-DD). Blank = same as start'
        required: false
        default: ''
        type: string

# Never run two ETL jobs at once (avoids duplicate work / DB races)
concurrency:
  group: insider-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas yfinance requests

      - name: Run ETL Script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          if [ "$SCHEDULE" = "30 8 * * 2-6" ] || [ "$MODE_INPUT" = "daily" ]; then
            python etl.py daily "$START_DATE" "$END_DATE"
          else
            python etl.py
          fi
