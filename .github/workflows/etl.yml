name: Run Insider Trading ETL Live

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes for live polling
  workflow_dispatch:        # Allows manual run button in GitHub

jobs:
  run-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pandas yfinance requests

      - name: Run ETL Script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python etl.py
