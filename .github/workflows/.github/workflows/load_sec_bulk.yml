name: Load SEC Bulk Data

on:
  workflow_dispatch:
    inputs:
      quarters:
        description: "Comma-separated SEC quarters to load"
        required: true
        default: "2025q4,2026q1,2026q2,2026q3"

# Share the lock with the live ETL and Patch Prices so nothing writes at the same time
concurrency:
  group: insider-etl
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Load SEC bulk data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python load_sec_bulk.py --quarters "${{ github.event.inputs.quarters }}"
